# >>> heated-rivalry site block (managed from /opt/heated-rivalry; delete this block to roll back) >>>
heated-rivalry-trainer.spill-the-tea.xyz {
	tls {
		issuer acme {
			disable_tlsalpn_challenge
		}
	}
	header {
		-Server
		-Via
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "no-referrer"
		X-Frame-Options "DENY"
	}
	request_body {
		max_size 64KB
	}

	# ЗАКРЫТО до готовности авторизации: любой запрос → 500.
	# Открыть: удалить блок `handle` с respond и раскомментировать `reverse_proxy`, затем bin/caddy-reload.sh
	handle {
		header Cache-Control "no-store"
		respond 500
	}
	# encode zstd gzip
	# reverse_proxy heated-rivalry:8787
}
