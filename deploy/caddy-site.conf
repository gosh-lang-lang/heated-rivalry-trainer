# >>> heated-rivalry site block (managed from /opt/heated-rivalry; delete this block to roll back) >>>
heated-rivalry-trainer.spill-the-tea.xyz {
	tls {
		issuer acme {
			disable_tlsalpn_challenge
		}
	}
	header {
		-Server
		-Via
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "no-referrer"
		X-Frame-Options "DENY"
	}
	request_body {
		max_size 64KB
	}

	# Вход — в приложении (passkey): без сессии сервер отдаёт только страницу входа, API — 401.
	# Закрыть сайт целиком: заменить две строки ниже на `respond 500`, затем caddy-reload.sh
	encode zstd gzip
	reverse_proxy heated-rivalry:8787
}
# <<< heated-rivalry site block <<<
