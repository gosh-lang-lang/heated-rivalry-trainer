# Проверки на каждый push в main и на каждый PR: typecheck, unit (с настоящей озвучкой Kokoro), e2e (Chrome и WebKit).
# Тот же набор, что запускает deploy/deploy.sh перед выкаткой, — только сразу, а не в момент выкатки:
# поломку, отправленную в main любой сессией, видно за минуты (письмо от GitHub о красной проверке).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      # GPU нет: onnxruntime-node не должен качать CUDA-сборку (как в app/Dockerfile)
      npm_config_onnxruntime_node_install_cuda: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund

      # модель Kokoro (~330 МБ) для server/tts-worker.test.ts — не качать каждый раз
      - uses: actions/cache@v4
        with:
          path: app/node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-v1.0-fp32

      - run: npm run typecheck
      - run: npm test

      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
