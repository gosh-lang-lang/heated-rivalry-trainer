<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/styles.css"><link rel="stylesheet" href="app/glass.css"><link rel="stylesheet" href="mock.css"><link rel="stylesheet" href="screens.css"><link rel="stylesheet" href="path.css">
<style>
  body.pathpage{min-height:900px}
  .desk{max-width:1200px;margin:0 auto;padding:26px 24px 40px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .dhead h1{font-size:44px;letter-spacing:-.02em;margin-right:10px}
  .dhead .meta{color:var(--mute);font-weight:800;font-size:17px;margin-right:auto}
  .drink{position:relative;height:440px;border-radius:30px}
  .drink .rink-svg{position:absolute;inset:0}
  .dgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:24px;margin-top:22px;align-items:stretch}
  .dgrid .card{padding:20px 22px}
  .dgrid h3{font-size:20px}
  .dl-head{display:flex;justify-content:space-between;align-items:baseline}
  .dl-head span{color:var(--mute);font-weight:800;font-size:15px}
  .dgrid .parts{margin:8px 0 14px}
  .nextcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
  .nextcard p{margin:6px 0 0;color:var(--mute);font-weight:700;font-size:15px;line-height:1.4}
  .nextcard .k{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .nextcard b{display:block;font-size:22px;font-weight:900;margin-top:4px}
  .fan{display:flex;margin:14px 0 14px;padding-left:4px}
  .fan .fc{margin-left:-26px;transform:rotate(var(--r));display:block}
  .fan .fc:first-child{margin-left:0}
  .seasonbar{height:12px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:4px}
  .seasonbar i{display:block;height:100%;width:40%;background:var(--gold);border-radius:7px}
  .cnt{display:flex;justify-content:space-between;font-weight:800;color:var(--mute);font-size:15px;margin-top:8px}
  .lesson-pop.dpop{position:absolute;width:300px;left:auto;right:auto}
</style>
<script src="data.js"></script><script src="common.js"></script></head>
<body class="pathpage"><div class="app"><div id="root"></div></div>
<script>
const W = 1152, H = 440, CUR = 5;
const XS = (n) => 128 + (n - 1) * 99;
const YP = [220, 112, 220, 328, 220, 112, 220, 328, 220, 220];
const P = (n) => [XS(n), YP[n - 1]];
function curve(from, to) {
  const pts = []; for (let n = from; n <= to; n++) pts.push(P(n));
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${[p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6]} ${[p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6]} ${p2}`;
  }
  return d;
}
const cx = (XS(5) + XS(6)) / 2, bA = (XS(3) + XS(4)) / 2, bB = (XS(7) + XS(8)) / 2;
const circle = (x, y, r = 58) => `<g class="fo"><circle cx="${x}" cy="${y}" r="${r}"/><path d="M${x - 8} ${y - r - 10}v10M${x + 8} ${y - r - 10}v10M${x - 8} ${y + r}v10M${x + 8} ${y + r}v10"/></g><circle class="fod" cx="${x}" cy="${y}" r="7"/>`;
const rink = `<svg class="rink-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <rect class="ice" x="2" y="2" width="${W - 4}" height="${H - 4}" rx="150"/>
  <rect class="bl" x="${bA - 8}" y="2" width="16" height="${H - 4}"/><rect class="bl" x="${bB - 8}" y="2" width="16" height="${H - 4}"/>
  <rect class="rl" x="${cx - 4}" y="2" width="8" height="${H - 4}"/>
  <circle class="cc" cx="${cx}" cy="220" r="78"/>
  <path class="gl" d="M62 40V400M${W - 62} 40V400"/>
  <path class="crease" d="M62 186a34 34 0 0 1 0 68z"/><path class="crease" d="M${W - 62} 186a34 34 0 0 0 0 68z"/>
  <g class="net"><rect x="30" y="192" width="32" height="56" rx="8"/></g><g class="net"><rect x="${W - 62}" y="192" width="32" height="56" rx="8"/></g>
  ${circle(200, 112)}${circle(200, 328)}${circle(W - 200, 112)}${circle(W - 200, 328)}
  <circle class="fod" cx="${bA + 48}" cy="112" r="6"/><circle class="fod" cx="${bA + 48}" cy="328" r="6"/><circle class="fod" cx="${bB - 48}" cy="112" r="6"/><circle class="fod" cx="${bB - 48}" cy="328" r="6"/>
  <path class="trail-ahead" d="${curve(CUR, 10)}"/><path class="trail" d="${curve(1, CUR)}"/><path class="trail-in" d="${curve(1, CUR)}"/>
</svg>`;
let nodes = "";
for (let n = 1; n <= 10; n++) {
  const [x, y] = P(n);
  const st = n < CUR ? "done" : n === CUR ? "cur" : n === 10 ? "final" : "lock";
  const inner = st === "done" ? `<b>${n}</b><i class="ok">${ICON.check}</i>` : st === "cur" ? `<b>${n}</b>` : st === "final" ? `<span class="cup">🏆</span>` : `<b>${n}</b><i class="lk">${ICON.lock}</i>`;
  nodes += `<button class="node ${st}" style="left:${x}px;top:${y}px">${inner}</button>`;
  if (n === 10) nodes += `<span class="nlabel gold" style="left:${x}px;top:${y + 48}px">Финал сезона</span>`;
  if (n === 1) nodes += `<span class="nlabel" style="left:${x}px;top:${y + 46}px">Старт</span>`;
}
for (let n = 1; n <= 9; n++) {
  const [x1, y1] = P(n), [x2, y2] = P(n + 1);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const yy = my <= 220 ? 336 : 104;
  const c = CARDS[n - 1];
  const html = n < CUR ? cardFront(c, 3.8) : cardLocked(c, 3.8, n === CUR ? "next" : "far");
  nodes += `<div class="cmark${n < CUR ? " got" : n === CUR ? " nextc" : " far"}" style="left:${mx}px;top:${yy}px;--r:${(n % 2 ? 1 : -1) * 6}deg">${html}${n === CUR ? '<span class="cm-tag">после части 2</span>' : ""}</div>`;
}
const [x5, y5] = P(CUR);
nodes += `<div class="me-sk" style="left:${x5 - 152}px;top:${y5 - 78}px;width:118px">${SKATER()}</div>`;

const got = CARDS.slice(0, 4).map((c, i) => `<span class="fc" style="--r:${[-7, -2, 3, 8][i]}deg">${cardFront(c, 5.4)}</span>`).join("") + `<span class="fc" style="--r:12deg">${cardLocked(CARDS[4], 5.4, "next")}</span>`;
document.getElementById("root").innerHTML = `
<nav class="topnav"><div class="in">
  <span class="brand"><svg viewBox="0 0 32 32"><rect x="1.5" y="5.5" width="29" height="21" rx="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 5.5v21" stroke="var(--goal)" stroke-width="2.2"/><circle cx="16" cy="16" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>Тренажёр <small>по книге</small></span>
  <div class="tabs"><button>Сегодня</button><button aria-current="page">Путь</button><button>Слова</button><button>Я</button></div>
  <span class="date">Вторник, 24 ноября</span>
  <button class="theme-tg" role="switch" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="tg-knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></span></button>
</div></nav>
<div class="desk">
  <div class="dhead"><h1>Путь</h1><span class="meta">Сезон 1 · урок 5 из 10 · 4 карточки из 10</span>
    <span class="hchip">${ICON.flame}4 дня подряд</span><span class="hchip">${ICON.cards}4/10</span></div>
  <div class="drink">${rink}${nodes}</div>
  <div class="dgrid">
    <section class="card lesson-cardd">
      <div class="dl-head"><h3>Урок 5 · сегодня</h3><span>12 новых слов</span></div>
      <ol class="parts">
        <li class="done"><i>${ICON.check}</i><div><b>Часть 1 — учим</b><small>Готово · 34 из 38 · 16 мин</small></div></li>
        <li class="next"><i>2</i><div><b>Часть 2 — применяем</b><small>Лучше после 10:40 · можно и сейчас</small></div></li>
      </ol>
      <button class="btn wide">Начать часть 2</button>
    </section>
    <section class="card nextcard">
      ${cardLocked(CARDS[4], 6.4, "next")}
      <div><span class="k">Следующая карточка</span><b>№&thinsp;05 · Сцена</b><p>Откроется после части 2 урока 5. На обороте — 12 слов этого урока.</p></div>
    </section>
    <section class="card">
      <div class="dl-head"><h3>Коллекция</h3><span>Сезон 1</span></div>
      <div class="fan">${got}</div>
      <div class="seasonbar"><i></i></div>
      <div class="cnt"><span>4 из 10 карточек</span><span>Финал — урок 10</span></div>
    </section>
  </div>
</div>`;
chrome({ noTab: true });
document.querySelector(".sbar").remove(); document.querySelector(".homeind").remove();
</script></body></html>
